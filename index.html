<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sukhwinderpal & Tarveen Kaur</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Great+Vibes&display=swap"
      rel="stylesheet">


<style>

/* =========================================================
   BASIC RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#f2e0d5;
    color:#4a2528;
    font-family:'Cormorant Garamond',serif;
    overflow-x:hidden;
}

button,
a{
    font-family:'Cormorant Garamond',serif;
}


/* =========================================================
   OPENING
========================================================= */

#opening{

    position:fixed;

    inset:0;

    z-index:10000;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(160,42,66,.20),
            transparent 45%
        ),
        #21060c;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =========================================================
   CURTAINS
========================================================= */

.curtain{

    position:absolute;

    top:0;

    width:53%;

    height:100%;

    z-index:3;

    background:

        repeating-linear-gradient(
            90deg,

            #2a0710 0px,

            #58121f 30px,

            #3a0914 60px,

            #761a2c 92px,

            #350912 125px,

            #691523 155px
        );

    box-shadow:

        inset 0 0 45px rgba(0,0,0,.65),

        0 0 35px rgba(0,0,0,.45);

    transition:

        transform 2.2s
        cubic-bezier(.77,0,.18,1);
}

.curtain.left{
    left:0;
}

.curtain.right{
    right:0;
}

#opening.opened .curtain.left{
    transform:translateX(-105%);
}

#opening.opened .curtain.right{
    transform:translateX(105%);
}


/* =========================================================
   OPENING DECORATION
========================================================= */

.openDecor{
    position:absolute;
    z-index:4;
    pointer-events:none;
}

.flower{
    position:absolute;
    font-size:35px;
    opacity:.85;
    filter:drop-shadow(0 4px 5px rgba(0,0,0,.4));
}

.flower.one{
    top:9%;
    left:8%;
}

.flower.two{
    top:12%;
    right:8%;
}

.flower.three{
    bottom:10%;
    left:9%;
}

.flower.four{
    bottom:12%;
    right:9%;
}


/* =========================================================
   CHANDELIER
========================================================= */

.chandelier{

    position:absolute;

    z-index:5;

    top:0;

    left:50%;

    transform:translateX(-50%);

    width:170px;

    height:130px;

    pointer-events:none;

    opacity:.9;
}

.chandelier .chain{

    position:absolute;

    left:50%;

    top:0;

    width:2px;

    height:45px;

    background:#d8b77f;

    transform:translateX(-50%);
}

.chandelier .body{

    position:absolute;

    top:40px;

    left:50%;

    transform:translateX(-50%);

    width:95px;

    height:35px;

    border:2px solid #d8b77f;

    border-radius:50%;

    box-shadow:
        0 0 20px rgba(255,210,120,.45);
}

.chandelier .light{

    position:absolute;

    width:13px;

    height:13px;

    border-radius:50%;

    background:#ffe7a4;

    box-shadow:
        0 0 18px #ffe7a4;

    top:54px;
}

.chandelier .light:nth-child(2){
    left:28px;
}

.chandelier .light:nth-child(3){
    left:50%;

    transform:translateX(-50%);
}

.chandelier .light:nth-child(4){
    right:28px;
}


/* =========================================================
   OPENING CONTENT
========================================================= */

.openContent{

    position:relative;

    z-index:20;

    text-align:center;

    color:#f8ead8;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

#opening.opened .openContent{

    opacity:0;

    transform:scale(.96);
}


.openTop{

    font-size:14px;

    letter-spacing:5px;

    margin-bottom:35px;
}


.initials{

    font-family:'Great Vibes',cursive;

    font-size:105px;

    line-height:.62;

    display:flex;

    flex-direction:column;

    align-items:center;

    text-shadow:
        0 4px 10px rgba(0,0,0,.55);
}

.initials .amp{

    font-family:'Cormorant Garamond',serif;

    font-size:43px;

    line-height:1;

    margin:17px 0;
}


.openButton{

    margin-top:50px;

    padding:15px 32px;

    border:1px solid
        rgba(248,234,216,.75);

    border-radius:50px;

    background:#f8ead8;

    color:#4a2528;

    font-size:17px;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 8px 30px rgba(0,0,0,.28);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.openButton:hover{

    transform:translateY(-2px);

    box-shadow:
        0 12px 35px rgba(0,0,0,.35);
}

.openButton:active{

    transform:scale(.97);
}


/* =========================================================
   MAIN
========================================================= */

#mainInvitation{
    display:none;
}

.section{

    position:relative;

    overflow:hidden;

    padding:90px 20px;

    text-align:center;
}

.section::before{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.72),
            transparent 34%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(125,55,70,.08),
            transparent 38%
        );
}

.section > *{

    position:relative;

    z-index:1;
}


/* =========================================================
   INTRO
========================================================= */

.intro{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:

        radial-gradient(
            circle at center,
            #fffaf5,
            #f6e9e0 52%,
            #e6d0c5
        );
}

.smallHeading{

    font-size:14px;

    letter-spacing:4px;

    color:#94706b;

    margin-bottom:18px;
}

.scriptHeading{

    font-family:'Great Vibes',cursive;

    font-size:66px;

    color:#702b36;
}

.coupleNames{

    margin-top:18px;

    font-size:57px;

    line-height:1.05;

    color:#4a2528;
}

.introText{

    max-width:620px;

    margin:25px auto;

    font-size:20px;

    line-height:1.7;

    color:#705653;
}

.ornament{

    color:#8d4e58;

    font-size:25px;

    letter-spacing:8px;
}


/* =========================================================
   SCRATCH SECTION
========================================================= */

.scratchSection{

    background:

        radial-gradient(
            circle at center,
            #fffaf5,
            #f0ded4 55%,
            #e5cec2
        );
}

.secretText{

    margin-bottom:35px;

    font-size:20px;

    font-style:italic;

    color:#8d6d68;
}


/* =========================================================
   SCRATCH WRAPPER
========================================================= */

.scratchWrapper{

    position:relative;

    width:min(90vw,430px);

    height:250px;

    margin:auto;

    border-radius:18px;

    overflow:hidden;

    isolation:isolate;

    background:
        linear-gradient(
            135deg,
            #fffaf5,
            #f1ddd3
        );

    box-shadow:
        0 15px 40px
        rgba(70,25,30,.18);
}


/* =========================================================
   REVEALED CARD
========================================================= */

.secretReveal{

    position:absolute;

    inset:0;

    z-index:1;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        linear-gradient(
            135deg,
            #fffaf5,
            #f2ddd3
        );
}

.secretRevealInner{

    width:100%;

    height:100%;

    border:1px solid #b98980;

    border-radius:12px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}

.saveTitle{

    font-size:17px;

    letter-spacing:5px;

    color:#7b3540;

    margin-bottom:12px
